        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "A browser version of peg solitaire: each move jumps a peg over an adjacent peg into an empty hole and removes the jumped peg, and the goal is to leave a single peg, ideally in the centre. Includes the English 33-hole, European 37-hole and 15-hole triangle boards with undo, a hint and a search-based solver."
      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do you play peg solitaire?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Move a peg by jumping it over an adjacent peg into an empty hole directly beyond. The peg you jumped over is removed. Keep making jumps until you cannot move; you win if a single peg is left."
            }
          },
          {
            "@type": "Question",
            "name": "Can peg solitaire always be solved?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "On the standard English board starting with only the centre hole empty, yes — it can always be finished with the last peg in the centre, in 31 moves. Other starting holes and the European board have their own constraints, and careless play can strand pegs."
            }
          },
          {
            "@type": "Question",
            "name": "What is the best first move?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "From the standard centre-empty start all four opening jumps are symmetric, so it does not matter. What matters is not clearing one arm of the cross completely and leaving isolated pegs elsewhere."
            }
          },
          {
            "@type": "Question",
            "name": "What is the triangle peg game?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The 15-hole triangular board often found on restaurant tables. You start with one hole empty and jump along the three edges of the triangle. Leaving one peg is 'genius'; most people finish with three or four."
            }
          }
        ]
      }
    </script>
